[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-ancestry"
version = "0.1.0"
description = "Know where your training data came from and what you are allowed to do with it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "eliem08" }]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: Other/Proprietary License",
  "Operating System :: OS Independent",
  "Private :: Do Not Upload",
]

[project.optional-dependencies]
dev = ["ruff==0.15.20"]

[project.scripts]
dataset-ancestry = "dataset_ancestry.__main__:main"
dataset-ancestry-web = "dataset_ancestry.web:main"

[project.urls]
Repository = "https://github.com/eliem08/dataset-ancestry"

[tool.setuptools]
packages = ["dataset_ancestry"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "SIM", "RUF"]
ignore = ["E501", "E741", "SIM108", "RUF001", "RUF002", "RUF003", "RUF022", "B905"]  # E501: ruff format owns line length

[tool.ruff.lint.per-file-ignores]
"dataset_ancestry/__init__.py" = ["F401", "F403"]
"tests/*" = ["E501"]
