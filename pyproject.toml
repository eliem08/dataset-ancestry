[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-ancestry"
version = "0.1.0"
description = "Ancestry for datasets: where your training data came from"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
dataset-ancestry = "dataset_ancestry.__main__:main"

[tool.setuptools]
packages = ["dataset_ancestry"]
